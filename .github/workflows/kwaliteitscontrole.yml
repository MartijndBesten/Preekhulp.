name: Preekhulp kwaliteitscontrole

on:
  push:
    branches:
      - 'claude/**'
      - 'improve/**'
  pull_request:
  workflow_dispatch:
    inputs:
      volledige_brondata:
        description: 'Haal de open Bijbel- en commentaardatasets op voor integratietests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: preekhulp-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-en-bouw:
    name: Types, eenheidstests en productiebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  academische-api-proef:
    name: Externe academische API-proef (zonder betaalde sleutels)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run bronnen:proef
        env:
          # Optioneel: gratis sleutels als repository-secret; leeg = proef zonder sleutel.
          PREEKHULP_OPENALEX_KEY: ${{ secrets.PREEKHULP_OPENALEX_KEY }}
          PREEKHULP_YOUTUBE_KEY: ${{ secrets.PREEKHULP_YOUTUBE_KEY }}
          PREEKHULP_CORE_KEY: ${{ secrets.PREEKHULP_CORE_KEY }}
      - name: Proefresultaat bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bronnenproef
          path: bronnenproef.json
          if-no-files-found: ignore

  met-open-brondata:
    name: Volledige lokale Genesis 31-integratietest
    if: github.event_name == 'workflow_dispatch' && inputs.volledige_brondata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run data:ophalen
      - run: npm run data:importeren
      - run: npm test
      - run: npm run evaluatie -- --modus verdiepen
